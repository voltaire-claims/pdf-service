services:
  pdf-service:
    build: .
    ports:
      - "${PORT:-8000}:80"
    environment:
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
